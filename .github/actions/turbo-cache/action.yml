name: Check the turbo cache
description: Report which tasks of a turbo run the cache does not hold, so a job can skip the setup that only those tasks need.

inputs:
  args:
    description: The arguments of the `turbo run` the job goes on to make.
    required: true
  shard:
    description: The React test shard, when the run is sharded. It is part of the test task's hash.
    required: false

outputs:
  misses:
    description: The ids of the tasks turbo would run, separated by spaces. Empty when every task would be restored.
    value: ${{ steps.dry.outputs.misses }}

runs:
  using: composite
  steps:
    # An empty VITEST_SHARD hashes differently from an unset one, so it is set
    # only for a sharded run.
    - name: Check the turbo cache
      id: dry
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        SHARD: ${{ inputs.shard }}
      run: |
        if [ -n "$SHARD" ]; then export VITEST_SHARD="$SHARD"; fi
        misses=$(bunx turbo run $ARGS --dry=json | jq -r '[.tasks[] | select(.cache.status != "HIT") | .taskId] | join(" ")')
        echo "Not in the cache: ${misses:-nothing}"
        echo "misses=$misses" >> "$GITHUB_OUTPUT"
