name: Setup mbx
description: Restore mbx's compiled objects for one Cargo workspace and route cargo through mbx, so only changed crates compile.

inputs:
  working-directory:
    description: The directory of the Cargo workspace that the job builds.
    required: true

runs:
  using: composite
  steps:
    # Brings back mbx's compiled objects from the last build on this pull
    # request, or else on the default branch. Objects match by content, so the
    # crates in the `zed` submodule are cache hits on a fresh checkout; Cargo's
    # own target directory would treat them as changed and recompile them.
    # Runs after the toolchain is installed, because the cache key includes
    # the compiler.
    - name: Setup mbx
      uses: jdx/mr-boxington-action@1687e54eb349cadf61fa38b5813a77875489e8e6 # v1.6.0
      with:
        working-directory: ${{ inputs.working-directory }}
        github-cache-mode: objects
        save-on-workflow-dispatch: true
        save-on-pull-request: true

    # mbx's Cargo shim goes first on PATH, so tools that run `cargo`, such as
    # napi, go through it too.
    - name: Route cargo through mbx
      shell: bash
      run: |
        mbx setup --yes
        case "$RUNNER_OS" in
          macOS) echo "$HOME/Library/Application Support/mbx/bin" >> "$GITHUB_PATH" ;;
          Linux) echo "$HOME/.local/share/mbx/bin" >> "$GITHUB_PATH" ;;
          Windows) echo "$LOCALAPPDATA\\mbx\\bin" >> "$GITHUB_PATH" ;;
        esac
