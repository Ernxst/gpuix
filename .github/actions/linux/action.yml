name: Setup Linux
description: Install the system libraries GPUI needs to build on Linux.

runs:
  using: composite
  steps:
    # Linux system deps for GPUI (Vulkan, Wayland, X11, fonts)
    # Based on longbridge/gpui-component and Zed's script/linux
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y \
          gcc g++ clang \
          libfontconfig-dev \
          libwayland-dev \
          libxkbcommon-x11-dev \
          libx11-xcb-dev \
          libssl-dev \
          libzstd-dev \
          libvulkan1 \
          vulkan-validationlayers
