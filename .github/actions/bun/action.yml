name: Setup Bun
description: Install the Bun version pinned in package.json and the locked dependencies.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    # `bun install` takes about 24 seconds on the GitHub-hosted Windows runner,
    # most of it downloading packages, so Bun's package cache is kept there.
    - name: Restore the package cache
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
