name: CI
env:
  APP_NAME: gpuix-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"
"on":
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - docs/**
  pull_request: null
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated OSes to build and test: macos, linux, windows"
        required: false
        default: "macos,linux,windows"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # push/PR builds Linux x64 and Windows x64; macOS is built and tested
  # locally. workflow_dispatch builds and tests the OSes named by its `targets` input
  # (all three by default). Computed in a plan job because job-level `if`
  # cannot reference the matrix context.
  # One target per OS, on the architecture that OS is mostly used on
  # (upstream's set): `packages/native/package.json` `napi.targets` must
  # list exactly the same set as the FULL matrix below.
  plan:
    runs-on: ubuntu-latest
    outputs:
      settings: ${{ steps.set.outputs.settings }}
    steps:
      - id: set
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          # macOS (Metal): default features include test-support.
          # Linux (Vulkan/wgpu): build:release disables test-support until wgpu image readback lands.
          # Windows (Direct3D): test support includes TestGpuixRenderer and render_to_image.
          FULL='[
            {"os":"macos","host":"macos-latest","target":"aarch64-apple-darwin","bunTarget":"bun-darwin-arm64","build":"bun run build --target aarch64-apple-darwin"},
            {"os":"linux","host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","bunTarget":"bun-linux-x64","build":"bun run build:release --target x86_64-unknown-linux-gnu"},
            {"os":"windows","host":"windows-latest","target":"x86_64-pc-windows-msvc","bunTarget":"bun-windows-x64","build":"bun run build --target x86_64-pc-windows-msvc"}
          ]'
          LINUX_WINDOWS=$(echo "$FULL" | jq -c 'map(select(.os != "macos"))')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHOSEN=$(echo "$FULL" | jq -c --arg targets "$TARGETS" '
              ($targets | gsub(" "; "") | ascii_downcase | split(",")) as $want
              | map(select(.os as $os | $want | index($os)))')
            if [ "$CHOSEN" = "[]" ]; then
              echo "::error::targets '$TARGETS' selects no OS; use macos, linux or windows"
              exit 1
            fi
          else
            CHOSEN="$LINUX_WINDOWS"
          fi
          echo "settings=$(echo "$CHOSEN" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.plan.outputs.settings) }}
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # Reads the channel from rust-toolchain.toml, which must match zed's
      # pin for the gpui revision in packages/native/Cargo.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.settings.target }}
          # this workflow caches cargo explicitly in the next step
          cache: false
          # the action defaults to RUSTFLAGS="-D warnings"; keep lint policy
          # in the crate instead of letting CI deny every warning
          rustflags: ""

      # gpui_apple compiles shaders with `metal`, which Xcode 26 no longer
      # ships by default. Without this the build fails with
      # "cannot execute tool 'metal' due to missing Metal Toolchain".
      - name: Install Metal toolchain
        if: contains(matrix.settings.target, 'apple-darwin')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-

      # Linux system deps for GPUI (Vulkan, Wayland, X11, fonts)
      # Based on longbridge/gpui-component and Zed's script/linux
      - name: Install Linux dependencies
        if: contains(matrix.settings.target, 'linux')
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Check all Rust targets without default features
        if: contains(matrix.settings.target, 'linux')
        run: RUST_FONTCONFIG_DLOPEN=1 cargo check --target x86_64-unknown-linux-gnu --no-default-features --all-targets

      - name: Build native
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/native/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

      - name: Build display-discovery fault-injection binding
        if: matrix.settings.target == 'aarch64-apple-darwin'
        run: bun run build:test-fault-injection --target aarch64-apple-darwin --output-dir test-fault-binding --no-js

      - name: Upload display-discovery fault-injection binding
        if: matrix.settings.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: bindings-test-fault-aarch64-apple-darwin
          path: packages/native/test-fault-binding/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

      - name: Build React package
        working-directory: packages/react
        shell: bash
        run: bun run build

      - name: Build plugins package
        run: bun run build
        working-directory: packages/plugins

      - name: Test plugins package
        run: bun run test
        working-directory: packages/plugins

      - name: Compile chat example
        working-directory: examples
        shell: bash
        env:
          COMPILE_OUT: example-chat-${{ matrix.settings.target }}
          COMPILE_TARGET: ${{ matrix.settings.bunTarget }}
          COMPILE_SKIP_ICONS: "1"
          COMPILE_SKIP_APP: "1"
        run: bun compile-chat.ts

      # A release asset is served as raw bytes, so a download loses the
      # executable bit and arrives with no extension: macOS and Linux users
      # got a file the OS refused to open. `.tar.gz` keeps the mode and names
      # itself. Windows already ships a `.exe`, which needs no unpacking.
      - name: Package chat example
        working-directory: examples/dist
        shell: bash
        env:
          NAME: example-chat-${{ matrix.settings.target }}
        run: |
          if [ -f "$NAME.exe" ]; then
            echo "$NAME.exe already carries an extension"
            exit 0
          fi
          chmod +x "$NAME"
          tar -czf "$NAME.tar.gz" "$NAME"
          rm "$NAME"
          ls -l

      - name: Upload example artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-chat-${{ matrix.settings.target }}
          path: examples/dist/example-chat-${{ matrix.settings.target }}.*
          if-no-files-found: error

  test:
    name: test
    needs: build
    # Needs the macOS artifact, which only exists on dispatch runs that target macOS.
    if: github.event_name == 'workflow_dispatch' && contains(inputs.targets, 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: packages/native/

      - name: Smoke test published test renderer without display discovery
        run: bun scripts/test-renderer-smoke.ts

      - name: Download display-discovery fault-injection artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-test-fault-aarch64-apple-darwin
          path: packages/native/test-fault-binding/

      - name: Smoke test catchable display-discovery failure
        env:
          NAPI_RS_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/packages/native/test-fault-binding/gpuix-native.darwin-arm64.node
        run: bun scripts/test-renderer-smoke.ts --fault-injection

      # Includes the GPU-backed default-main-menu and Cmd+Q action smoke.
      - name: Run React and macOS menu integration tests
        run: bun run test
        working-directory: packages/react

      - name: Build React package
        run: bun run build
        working-directory: packages/react

      - name: Run example tests
        run: bun run test
        working-directory: examples

      # Bun never typechecks. This step is what catches a broken public type,
      # such as `key` disappearing from every element.
      - name: Typecheck the example app
        run: bun run typecheck
        working-directory: example-app

  test-linux:
    name: test-linux
    needs: build
    if: github.event_name == 'workflow_dispatch' && contains(inputs.targets, 'linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Install Linux dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers \
            xvfb xauth

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/native/

      - name: Run React tests
        # These suites construct TestGpuixRenderer, which the Linux binding omits
        # because wgpu cannot read rendered images back yet. The remaining React
        # tests do not need GPU image readback and still run on Linux.
        run: |
          bun run build
          bun run typecheck:test
          bun run vitest run \
            --exclude src/__tests__/canvas-wpt.test.tsx \
            --exclude 'src/__tests__/{baseline-layout.test.tsx,border-box-sizing.test.tsx,bun-preload-hover-group.test.ts,code.test.tsx,diff-native.test.tsx,frame-clock.test.tsx,globals.test.tsx,grid-layout.test.tsx,highlight.test.tsx,intrinsic-and-viewport-lengths.test.tsx,markdown.test.tsx,resolved-style.test.tsx,satisfactory-focus-within-repro.test.tsx,scroll-percentage-layout.test.tsx,selection-layout.test.tsx,selection.test.tsx,showcase.test.tsx,spacing-percentage-layout.test.tsx,style-coverage.test.tsx,testing-per-file-isolation.test.tsx,virtual-list.test.tsx}'
        working-directory: packages/react

      - name: Run example tests
        run: bun run test
        working-directory: examples

      # GPUI's test target does not compile on Linux at the pinned Zed revision; see #828.

  test-gpui-macos:
    name: test-gpui-macos
    if: github.event_name == 'workflow_dispatch' && contains(inputs.targets, 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Test GPUI
        run: cargo test -p gpui
        working-directory: zed

  test-windows:
    name: test-windows
    needs: build
    # Needs the Windows artifact, which only exists on dispatch runs that target Windows.
    if: github.event_name == 'workflow_dispatch' && contains(inputs.targets, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: packages/native/

      - name: Load native binding with Bun
        run: bun -e "require('./packages/native'); console.log('Windows native binding OK (bun)')"

      - name: Load native binding with Node
        run: node -e "require('./packages/native'); console.log('Windows native binding OK (node)')"

      - name: Verify Windows test renderer
        shell: bash
        run: bun -e "const { statSync } = require('node:fs'); const { TestGpuixRenderer } = require('./packages/native'); const renderer = new TestGpuixRenderer(320, 200); renderer.applyBatch(JSON.stringify([['createElement',1,'text'],['setText',1,'Windows test renderer'],['setRoot',1]])); renderer.flush(); renderer.captureScreenshot('windows-test-renderer.png'); if (renderer.getAllText()[0] !== 'Windows test renderer' || statSync('windows-test-renderer.png').size === 0) throw new Error('TestGpuixRenderer did not render')"

      - name: Run React tests
        run: bun run test
        working-directory: packages/react

      - name: Build React package
        run: bun run build
        working-directory: packages/react

      - name: Run example tests
        run: bun run test
        working-directory: examples
