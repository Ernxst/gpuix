name: CI

# A change that touches only the excluded paths starts no run, because no task
# reads them. The plugins tests read `skills/`, so its Markdown stays in.
on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.changeset/**"
      - "!website/**"
      - "!.agents/**"
      - "skills/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.changeset/**"
      - "!website/**"
      - "!.agents/**"
      - "skills/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  # `lto = true` makes Cargo embed LLVM bitcode in every dependency. The addon
  # is both a cdylib and an rlib, and Cargo passes no `-C lto` flag for such a
  # crate, so nothing reads that bitcode. Turning LTO off skips producing it.
  CARGO_PROFILE_RELEASE_LTO: "false"
  # What the Rust setup action would export. The native build's cache key
  # includes them, so they are set for every job: jobs that skip the Rust setup
  # then restore the build job's addon instead of missing the cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_UNSTABLE_SPARSE_REGISTRY: "true"
  RUST_BACKTRACE: short
  # Each `turbo run` writes what its tasks cost to .turbo/runs, which the
  # turbo-summary action reports.
  TURBO_RUN_SUMMARY: "true"

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Lint monorepo
        run: bunx turbo run "//#lint:monorepo"

      - name: Lint dependencies
        run: bunx turbo run "//#lint:dependencies"

  # Each platform builds and then tests on its own, so one platform's tests
  # never wait for another platform's build. The build stores the packages in
  # the turbo remote cache, and the test and typecheck jobs restore them.
  # A build job also reports the compiler versions it built with, which the
  # native tasks hash; the jobs that restore its build set GPUIX_HOST_TOOLS
  # from that output, so their hashes match on a different image.
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      host-tools: ${{ steps.build.outputs.host-tools }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build
        id: build
        uses: ./.github/actions/build

  build-linux:
    name: Build (Linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      host-tools: ${{ steps.build.outputs.host-tools }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build
        id: build
        uses: ./.github/actions/build

  build-windows:
    name: Build (Windows)
    runs-on: blacksmith-4vcpu-windows-2025
    permissions:
      contents: read
    outputs:
      host-tools: ${{ steps.build.outputs.host-tools }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build
        id: build
        uses: ./.github/actions/build

  typecheck:
    name: Typecheck
    # Runs on macOS because the native binding's types include the test
    # renderer, which the Linux build leaves out.
    needs: build-macos
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      GPUIX_HOST_TOOLS: ${{ needs.build-macos.outputs.host-tools }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Check the turbo cache
        id: cache
        uses: ./.github/actions/turbo-cache
        with:
          args: typecheck

      # This job installs no Rust toolchain. Without the addon in the cache,
      # turbo would compile it with whatever Cargo the runner has.
      - name: Require the addon from the build job
        if: contains(steps.cache.outputs.misses, '@gpuix/native#build')
        shell: bash
        run: |
          echo "::error::The turbo cache does not hold the addon this platform's build job stores. Check that the build job wrote to the remote cache."
          exit 1

      - name: Setup macos
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/macos

      - name: Typecheck
        run: bun run typecheck

      - name: Report the turbo runs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/turbo-summary
        with:
          name: turbo-runs-typecheck

  test-macos:
    name: Test (macOS, ${{ matrix.part.name }})
    needs: build-macos
    # React's suite is most of the test time, so it runs as three shards on
    # separate runners. The other packages share one. GitHub runs five macOS
    # jobs at a time for this repository, which these four and the typecheck
    # fill; a fourth shard would wait for a runner.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: react 1/3
            shard: 1/3
            filter: --filter=@gpuix/react
          - name: react 2/3
            shard: 2/3
            filter: --filter=@gpuix/react
          - name: react 3/3
            shard: 3/3
            filter: --filter=@gpuix/react
          - name: others
            filter: --filter=!@gpuix/react
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      GPUIX_HOST_TOOLS: ${{ needs.build-macos.outputs.host-tools }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test
        uses: ./.github/actions/test
        with:
          filter: ${{ matrix.part.filter }}
          shard: ${{ matrix.part.shard }}
          summary-name: turbo-runs-test-${{ runner.os }}-${{ strategy.job-index }}

  test-windows:
    name: Test (Windows, ${{ matrix.part.name }})
    needs: build-windows
    # A GitHub-hosted runner, not Blacksmith's. The test renderer opens a real
    # DirectX window, which needs an interactive desktop session, and
    # Blacksmith runs its Windows agent as a service in session 0, where
    # creating the DirectX renderer fails.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: react 1/3
            shard: 1/3
            filter: --filter=@gpuix/react
          - name: react 2/3
            shard: 2/3
            filter: --filter=@gpuix/react
          - name: react 3/3
            shard: 3/3
            filter: --filter=@gpuix/react
          - name: others
            filter: --filter=!@gpuix/react
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      GPUIX_HOST_TOOLS: ${{ needs.build-windows.outputs.host-tools }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test
        uses: ./.github/actions/test
        with:
          filter: ${{ matrix.part.filter }}
          shard: ${{ matrix.part.shard }}
          summary-name: turbo-runs-test-${{ runner.os }}-${{ strategy.job-index }}

  test-linux:
    name: Test (Linux)
    needs: build-linux
    # Linux has no test renderer, so packages/react/vitest.config.ts leaves out
    # the files that need one. What remains takes seconds, so one runner tests
    # every package.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      GPUIX_HOST_TOOLS: ${{ needs.build-linux.outputs.host-tools }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test
        uses: ./.github/actions/test
        with:
          summary-name: turbo-runs-test-Linux

  test-gpui:
    name: Test GPUI (macOS)
    # GPUI's own suite takes about ten minutes. Its inputs are in the `zed`
    # submodule, so turbo replays the result until the submodule changes.
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Identify the host tools
        uses: ./.github/actions/host-tools

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Check the turbo cache
        id: cache
        uses: ./.github/actions/turbo-cache
        with:
          args: test:gpui

      - name: Setup rust
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/rust

      - name: Setup macos
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/macos

      - name: Setup mbx
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/mbx
        with:
          working-directory: zed

      - name: Test GPUI
        run: bun run test:gpui

      - name: Report the turbo runs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/turbo-summary
        with:
          name: turbo-runs-test-gpui

  check-linux:
    name: Check without default features (Linux)
    # `build:release` ships the addon without `test-support`, a feature set no
    # other job compiles. This checks it, and the Rust examples with it.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Identify the host tools
        uses: ./.github/actions/host-tools

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Check the turbo cache
        id: cache
        uses: ./.github/actions/turbo-cache
        with:
          args: check:no-default-features

      - name: Setup rust
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/rust

      - name: Setup linux
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/linux

      - name: Setup mbx
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/mbx
        with:
          working-directory: packages/native

      - name: Check without default features
        run: bunx turbo run check:no-default-features

      - name: Report the turbo runs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/turbo-summary
        with:
          name: turbo-runs-check-linux

  test-fault-injection:
    name: Test fault injection (macOS)
    # Runs native-binding.test.ts against an addon built to fail renderer
    # initialisation. The ordinary addon's `index.js` loads it, so this waits
    # for the macOS build.
    needs: build-macos
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      GPUIX_HOST_TOOLS: ${{ needs.build-macos.outputs.host-tools }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Check the turbo cache
        id: cache
        uses: ./.github/actions/turbo-cache
        with:
          args: test:fault-injection

      - name: Setup node
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/node

      - name: Setup macos
        if: steps.cache.outputs.misses != ''
        uses: ./.github/actions/macos

      - name: Setup rust
        if: contains(steps.cache.outputs.misses, '@gpuix/native#')
        uses: ./.github/actions/rust

      - name: Setup mbx
        if: contains(steps.cache.outputs.misses, '@gpuix/native#')
        uses: ./.github/actions/mbx
        with:
          working-directory: packages/native

      - name: Test fault injection
        run: bunx turbo run test:fault-injection

      - name: Report the turbo runs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/turbo-summary
        with:
          name: turbo-runs-test-fault-injection

  example-chat:
    name: Compile chat example (${{ matrix.settings.target }})
    # The standalone chat binary that a release can carry. Nothing attaches it
    # to a release, so it is built only on a manual run.
    if: github.event_name == 'workflow_dispatch'
    needs: [build-macos, build-linux, build-windows]
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            build: build-macos
            target: aarch64-apple-darwin
            bunTarget: bun-darwin-arm64
          - host: blacksmith-2vcpu-ubuntu-2404
            build: build-linux
            target: x86_64-unknown-linux-gnu
            bunTarget: bun-linux-x64
          - host: windows-latest
            build: build-windows
            target: x86_64-pc-windows-msvc
            bunTarget: bun-windows-x64
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      GPUIX_HOST_TOOLS: ${{ needs[matrix.settings.build].outputs.host-tools }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Compile chat example
        shell: bash
        env:
          COMPILE_OUT: example-chat-${{ matrix.settings.target }}
          COMPILE_TARGET: ${{ matrix.settings.bunTarget }}
          COMPILE_SKIP_ICONS: "1"
          COMPILE_SKIP_APP: "1"
        run: bunx turbo run compile

      # A release asset is served as raw bytes, so a download loses the
      # executable bit and arrives with no extension: macOS and Linux users
      # got a file the OS refused to open. `.tar.gz` keeps the mode and names
      # itself. Windows already ships a `.exe`, which needs no unpacking.
      - name: Package chat example
        working-directory: examples/dist
        shell: bash
        env:
          NAME: example-chat-${{ matrix.settings.target }}
        run: |
          if [ -f "$NAME.exe" ]; then
            echo "$NAME.exe already carries an extension"
            exit 0
          fi
          chmod +x "$NAME"
          tar -czf "$NAME.tar.gz" "$NAME"
          rm "$NAME"
          ls -l

      - name: Upload example artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-chat-${{ matrix.settings.target }}
          path: examples/dist/example-chat-${{ matrix.settings.target }}.*
          if-no-files-found: error
