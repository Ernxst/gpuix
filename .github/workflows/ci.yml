name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  # `lto = true` makes Cargo embed LLVM bitcode in every dependency. The addon
  # is both a cdylib and an rlib, and Cargo passes no `-C lto` flag for such a
  # crate, so nothing reads that bitcode. Turning LTO off skips producing it.
  CARGO_PROFILE_RELEASE_LTO: "false"
  # What the Rust setup action would export. The native build's cache key
  # includes them, so they are set for every job: jobs that skip the Rust setup
  # then restore the build job's addon instead of missing the cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_UNSTABLE_SPARSE_REGISTRY: "true"
  RUST_BACKTRACE: short

permissions: {}

jobs:
  typecheck:
    name: Typecheck
    # Waits for the build so the native binding's types come from the cache.
    # Runs on macOS because those types include the test renderer, which the
    # Linux build leaves out.
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      # Only used when the remote cache has no native build for this commit.
      - name: Setup macos
        uses: ./.github/actions/macos

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos

      - name: Setup linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux

      # Brings back mbx's compiled objects from the last build on this pull
      # request, or else on the default branch. Objects match by content, so the
      # crates in the `zed` submodule are cache hits on a fresh checkout; Cargo's
      # own target directory would treat them as changed and recompile them.
      # Runs after the toolchain is installed, because the cache key includes
      # the compiler.
      #
      # Pinned to a commit on the action's main branch: v1.5.0, the latest
      # release, has no `save-on-pull-request`.
      - name: Setup mbx
        uses: jdx/mr-boxington-action@81ec44711945b482d44718f5f1543d2df54c6b19 # main
        with:
          working-directory: packages/native
          github-cache-mode: objects
          save-on-workflow-dispatch: true
          save-on-pull-request: true

      # napi runs `cargo`, so mbx's Cargo shim goes first on PATH.
      - name: Route cargo through mbx
        shell: bash
        run: |
          mbx setup --yes
          case "$RUNNER_OS" in
            macOS) echo "$HOME/Library/Application Support/mbx/bin" >> "$GITHUB_PATH" ;;
            Linux) echo "$HOME/.local/share/mbx/bin" >> "$GITHUB_PATH" ;;
            Windows) echo "$LOCALAPPDATA\\mbx\\bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Build
        if: runner.os != 'Linux'
        run: bun run build

      # `test-support` does not compile on Linux until wgpu image readback
      # lands, so Linux checks that the addon builds without it.
      - name: Build the native addon without test-support
        if: runner.os == 'Linux'
        run: bunx turbo run build:release --filter=@gpuix/native

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.part.name }})
    # Waits for the build so the packages come from the cache.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Linux has its own job, `test-linux`: this one runs the `test` task,
        # which needs a build that does not compile there.
        #
        # Windows stays on a GitHub-hosted runner. The test renderer opens a
        # real DirectX window, which needs an interactive desktop session, and
        # Blacksmith runs its Windows agent as a service in session 0, where
        # creating the DirectX renderer fails.
        os:
          - macos-latest
          - windows-latest
        # React's suite is most of the test time, so it runs as three shards on
        # separate runners. The other packages share one.
        part:
          - name: react 1/3
            shard: 1/3
          - name: react 2/3
            shard: 2/3
          - name: react 3/3
            shard: 3/3
          - name: others
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Setup macos
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos

      # packages/react/vitest.config.ts reads the shard from VITEST_SHARD, which
      # is part of the test task's hash.
      - name: Test React
        if: matrix.part.shard
        shell: bash
        env:
          VITEST_SHARD: ${{ matrix.part.shard }}
        run: bunx turbo run test --filter=@gpuix/react

      - name: Test the other packages
        if: ${{ !matrix.part.shard }}
        shell: bash
        run: bunx turbo run test --filter=!@gpuix/react --concurrency=1 --continue=dependencies-successful

  test-linux:
    name: Test (linux)
    # Waits for the build so the addon comes from the cache.
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      # The addon loads these libraries at run time.
      - name: Setup linux
        uses: ./.github/actions/linux

      # The `test` task depends on the native `build`, which does not compile
      # on Linux. So this job restores the addon built without `test-support`
      # and runs each package's own scripts, which turbo does not cache.
      - name: Restore the native addon
        run: bunx turbo run build:release --filter=@gpuix/native

      - name: Build React
        run: bun run build
        working-directory: packages/react

      # packages/react/vitest.config.ts leaves out the files that need the
      # test renderer.
      - name: Test React
        run: bun run test
        working-directory: packages/react

      - name: Test the examples
        run: bun run test
        working-directory: examples

      # GPUI's test target does not compile on Linux at the pinned Zed revision; see #828.

  test-gpui:
    name: Test GPUI (macos)
    # GPUI's own suite takes about eight minutes, so it runs on request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Test GPUI
        run: cargo test -p gpui
        working-directory: zed
