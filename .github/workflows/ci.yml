name: CI
env:
  APP_NAME: gpuix-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"
"on":
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - docs/**
  pull_request: null
  # Full 6-target matrix (macOS at 10x billing, Windows at 2x) only on
  # manual dispatch; push/PR runs build only the Linux x64 target.
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ── macOS (Metal) ──────────────────────────────────────────
          # default features include test-support (TestGpuixRenderer)
          - host: macos-latest
            target: aarch64-apple-darwin
            bunTarget: bun-darwin-arm64
            build: bun run build --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            bunTarget: bun-darwin-x64
            build: bun run build --target x86_64-apple-darwin
          # ── Linux (Vulkan/wgpu) ────────────────────────────────────
          # build:release skips test-support (pulls gpui_macos, macOS-only)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bunTarget: bun-linux-x64
            build: bun run build:release --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bunTarget: bun-linux-arm64
            build: bun run build:release --target aarch64-unknown-linux-gnu
          # ── Windows (Direct3D/wgpu) ────────────────────────────────
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            bunTarget: bun-windows-x64
            build: bun run build:release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            bunTarget: bun-windows-arm64
            build: bun run build:release --target aarch64-pc-windows-msvc
    name: build - ${{ matrix.settings.target }}
    # Cost control on this private repo: push/PR builds only Linux x64 (the
    # one platform not buildable locally); macOS verification stays local.
    if: github.event_name == 'workflow_dispatch' || matrix.settings.target == 'x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # Reads the channel from rust-toolchain.toml, which must match zed's
      # pin for the gpui revision in packages/native/Cargo.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.settings.target }}
          # this workflow caches cargo explicitly in the next step
          cache: false
          # the action defaults to RUSTFLAGS="-D warnings"; keep lint policy
          # in the crate instead of letting CI deny every warning
          rustflags: ""

      # gpui_apple compiles shaders with `metal`, which Xcode 26 no longer
      # ships by default. Without this the build fails with
      # "cannot execute tool 'metal' due to missing Metal Toolchain".
      - name: Install Metal toolchain
        if: contains(matrix.settings.target, 'apple-darwin')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-

      # Linux system deps for GPUI (Vulkan, Wayland, X11, fonts)
      # Based on longbridge/gpui-component and Zed's script/linux
      - name: Install Linux dependencies
        if: contains(matrix.settings.target, 'linux')
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        working-directory: .
        run: bun install

      - name: Build native
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/native/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

      - name: Build display-discovery fault-injection binding
        if: matrix.settings.target == 'aarch64-apple-darwin'
        run: bun run build:test-fault-injection --target aarch64-apple-darwin --output-dir test-fault-binding --no-js

      - name: Upload display-discovery fault-injection binding
        if: matrix.settings.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: bindings-test-fault-aarch64-apple-darwin
          path: packages/native/test-fault-binding/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

      - name: Build React package
        working-directory: packages/react
        shell: bash
        run: bun run build

      - name: Compile chat example
        working-directory: examples
        shell: bash
        env:
          COMPILE_OUT: example-chat-${{ matrix.settings.target }}
          COMPILE_TARGET: ${{ matrix.settings.bunTarget }}
          COMPILE_SKIP_ICONS: "1"
          COMPILE_SKIP_APP: "1"
        run: bun compile-chat.ts

      - name: Upload example artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-chat-${{ matrix.settings.target }}
          path: examples/dist/example-chat-${{ matrix.settings.target }}*
          if-no-files-found: error

  test:
    name: test
    needs: build
    # Needs the macOS artifact, which only exists on dispatch runs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: packages/native/

      - name: Smoke test published test renderer without display discovery
        run: bun scripts/test-renderer-smoke.ts

      - name: Download display-discovery fault-injection artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-test-fault-aarch64-apple-darwin
          path: packages/native/test-fault-binding/

      - name: Smoke test catchable display-discovery failure
        env:
          NAPI_RS_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/packages/native/test-fault-binding/gpuix-native.darwin-arm64.node
        run: bun scripts/test-renderer-smoke.ts --fault-injection

      # Includes the GPU-backed default-main-menu and Cmd+Q action smoke.
      - name: Run React and macOS menu integration tests
        run: bun run test
        working-directory: packages/react

      - name: Build React package
        run: bun run build
        working-directory: packages/react

      - name: Run example tests
        run: bun run test
        working-directory: examples

  test-windows:
    name: test-windows-load
    needs: build
    # Needs the Windows artifact, which only exists on dispatch runs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: packages/native/

      - name: Load native binding with Bun
        run: bun -e "require('./packages/native'); console.log('Windows native binding OK (bun)')"

      - name: Load native binding with Node
        run: node -e "require('./packages/native'); console.log('Windows native binding OK (node)')"

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - test-windows
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install browser Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
          components: rust-src
          cache: false
          rustflags: ""

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install dependencies
        run: bun install

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: packages/native/artifacts

      - name: Create npm dirs and move artifacts
        run: |
          bunx @napi-rs/cli create-npm-dirs
          bunx @napi-rs/cli artifacts
        working-directory: packages/native

      - name: List packages
        run: ls -R packages/native/npm/
        shell: bash

      # NPM_TOKEN lives in Sigillo (npm/tokens, prod). CI only stores
      # SIGILLO_TOKEN. Rotate the npm token in one place.
      - name: Publish @gpuix/native
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_TOKEN }}
          SIGILLO_PROJECT: ${{ vars.SIGILLO_PROJECT }}
          SIGILLO_ENVIRONMENT: prod
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/native/package.json').version")
          if npm view "@gpuix/native@${CURRENT_VERSION}" version 2>/dev/null; then
            echo "@gpuix/native@${CURRENT_VERSION} already published, skipping"
          else
            echo "Publishing @gpuix/native@${CURRENT_VERSION}"
            cd packages/native
            bunx sigillo run --command 'printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > /tmp/gpuix-npmrc && NPM_CONFIG_USERCONFIG=/tmp/gpuix-npmrc npm publish --access public --provenance'
          fi

      - name: Build @gpuix/react
        run: bun run build
        working-directory: packages/react

      - name: Publish @gpuix/react
        env:
          SIGILLO_TOKEN: ${{ secrets.SIGILLO_TOKEN }}
          SIGILLO_PROJECT: ${{ vars.SIGILLO_PROJECT }}
          SIGILLO_ENVIRONMENT: prod
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/react/package.json').version")
          if npm view "@gpuix/react@${CURRENT_VERSION}" version 2>/dev/null; then
            echo "@gpuix/react@${CURRENT_VERSION} already published, skipping"
          else
            echo "Publishing @gpuix/react@${CURRENT_VERSION}"
            cd packages/react
            node -e "
              const fs = require('fs')
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
              const native = require('../native/package.json').version
              pkg.dependencies['@gpuix/native'] = '^' + native
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
            "
            bunx sigillo run --command 'printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > /tmp/gpuix-npmrc && NPM_CONFIG_USERCONFIG=/tmp/gpuix-npmrc npm publish --access public --provenance'
          fi

      - name: Download example artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          pattern: example-chat-*
          path: example-artifacts
          merge-multiple: true

      - name: Upload example binaries to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/react/package.json').version")
          TAG="@gpuix/react@${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub release for ${TAG}, skipping example upload"
            exit 0
          fi
          shopt -s nullglob
          files=(example-artifacts/example-chat-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example binaries to upload"
            exit 0
          fi
          echo "Uploading example-chat binaries to ${TAG}"
          gh release upload "$TAG" "${files[@]}" --clobber
