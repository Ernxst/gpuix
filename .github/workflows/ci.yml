name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  # Fat LTO re-optimises every crate at link time on every build and no cache
  # can skip it. CI builds only feed tests, so they go without it.
  CARGO_PROFILE_RELEASE_LTO: "false"

permissions: {}

jobs:
  typecheck:
    name: Typecheck
    # Waits for the build so the native binding's types come from the cache.
    # Runs on macOS because those types include the test renderer, which the
    # Linux build leaves out.
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      # Only used when the remote cache has no native build for this commit.
      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        uses: ./.github/actions/macos

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
      # napi runs this as its cargo, so the build goes through mbx.
      CARGO: mbx
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos

      - name: Setup linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux

      # Restores Cargo's compiled dependencies from the last build on the default
      # branch. Runs after the toolchain is installed, because the cache key
      # includes the compiler.
      - name: Setup mbx
        uses: jdx/mr-boxington-action@v1
        with:
          working-directory: packages/native
          save-on-workflow-dispatch: true

      - name: Build
        if: runner.os != 'Linux'
        run: bun run build

      # `test-support` does not compile on Linux until wgpu image readback
      # lands, so Linux checks that the addon builds without it.
      - name: Build the native addon without test-support
        if: runner.os == 'Linux'
        run: bunx turbo run build:release --filter=@gpuix/native

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.part.name }})
    # Waits for the build so the packages come from the cache.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # No Linux: its addon has no test renderer.
        #
        # Windows stays on a GitHub-hosted runner. The test renderer opens a
        # real DirectX window, which needs an interactive desktop session, and
        # Blacksmith runs its Windows agent as a service in session 0, where
        # creating the DirectX renderer fails.
        os:
          - macos-latest
          - windows-latest
        # React's suite is most of the test time, so it runs as three shards on
        # separate runners. The other packages share one.
        part:
          - name: react 1/3
            shard: 1/3
          - name: react 2/3
            shard: 2/3
          - name: react 3/3
            shard: 3/3
          - name: others
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos

      # Arguments after `--` change the hash of every task in the run, so the
      # shard jobs restore the build first and then run the test task alone.
      - name: Restore the build
        if: matrix.part.shard
        shell: bash
        run: bunx turbo run build --filter=@gpuix/react

      - name: Test React
        if: matrix.part.shard
        shell: bash
        run: bunx turbo run test --filter=@gpuix/react --only -- --shard=${{ matrix.part.shard }}

      - name: Test the other packages
        if: ${{ !matrix.part.shard }}
        shell: bash
        run: bunx turbo run test --filter=!@gpuix/react --concurrency=1
