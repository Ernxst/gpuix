name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"

permissions: {}

jobs:
  typecheck:
    name: Typecheck
    # Waits for the build so the native binding's types come from the cache.
    # Runs on macOS because those types include the test renderer, which the
    # Linux build leaves out.
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      # Only used when the remote cache has no native build for this commit.
      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        uses: ./.github/actions/macos

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos

      - name: Setup linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux

      - name: Build
        if: runner.os != 'Linux'
        run: bun run build

      # `test-support` does not compile on Linux until wgpu image readback
      # lands, so Linux checks that the addon builds without it.
      - name: Build the native addon without test-support
        if: runner.os == 'Linux'
        working-directory: packages/native
        run: bun run build:release

  test:
    name: Test (${{ matrix.os }})
    # Waits for the build so the packages come from the cache.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # No Linux: its addon has no test renderer.
        #
        # Windows stays on a GitHub-hosted runner. The test renderer opens a
        # real DirectX window, which needs an interactive desktop session, and
        # Blacksmith runs its Windows agent as a service in session 0, where
        # creating the DirectX renderer fails.
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup bun
        uses: ./.github/actions/bun

      - name: Setup rust
        uses: ./.github/actions/rust

      - name: Setup macos
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos

      - name: Test
        run: bun run test
