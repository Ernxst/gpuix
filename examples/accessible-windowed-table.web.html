<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React DOM virtual-list comparison</title>
    <style>
      body { margin: 0; font: 14px system-ui; color: #eceff4; background: #161b22; }
      #root { padding: 20px; }
      virtual-list { display: block; height: 560px; overflow: auto; border: 1px solid #536076; }
      [role="row"] { display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 8px; border-bottom: 1px solid #3b4252; }
      [role="row"]:nth-child(7n + 2) { min-height: 58px; }
      [role="cell"], [role="columnheader"] { width: 140px; }
      button { color: #006b8f; }
      #report { margin: 8px 0; color: #a3be8c; }
    </style>
  </head>
